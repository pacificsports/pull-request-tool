  * { box-sizing:border-box; }
  body { margin:0; font-family:'BarCon','Arial Narrow',Arial,Helvetica,sans-serif; background:#eef2f7; color:#0f1720; }
  .wrap { max-width:1180px; margin:0 auto; padding:16px; display:flex; gap:18px; align-items:flex-start; }
  .panel { width:380px; flex:none; background:#fff; border:1px solid #d5deea; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(20,40,80,.06); }
  .panel h1 { font-size:17px; margin:0 0 4px; }
  .panel .sub { font-size:12px; color:#66788f; margin:0 0 14px; }
  .panel label { display:block; font-size:12px; font-weight:800; color:#3a4658; margin:10px 0 4px; letter-spacing:.2px; }
  .panel input, .panel select { width:100%; font-size:16px; padding:9px 10px; border:1px solid #c4cfdd; border-radius:8px; background:#fff; }
  .panel input.auto { background:#f2fbf4; border-color:#b9e2c4; }
  .row2 { display:flex; gap:10px; }
  .row2 > div { flex:1; }
  .adv { font-size:12px; color:#546074; background:#f6f8fb; border:1px dashed #cdd8e6; border-radius:8px; padding:9px 10px; margin-top:12px; line-height:1.7; }
  .adv input { width:auto; display:inline-block; font-size:13px; padding:5px 6px; }
  .btn { display:block; width:100%; border:0; border-radius:9px; font-size:15px; font-weight:800; padding:12px; margin-top:10px; cursor:pointer; }
  .btn-go { background:#1466d6; color:#fff; }
  .btn-print { background:#0f9d58; color:#fff; }
  .btn-sm { background:#e6ebf2; color:#33405a; font-size:13px; padding:9px; }
  .stage { flex:1; min-width:0; }
  .hint { font-size:12px; color:#66788f; margin:0 0 8px; }

  /* ===== 6 x 4 in label ===== */
  #sheet { margin-top:14px; }
  .label { position:relative; width:6in; height:4in; background:#fff; border:1px solid #94a3b8; padding:0.14in 0.22in; margin:0 auto 12px; display:flex; flex-direction:column; overflow:hidden; page-break-after:always; }
  .l-top { display:flex; justify-content:space-between; align-items:baseline; font-size:10.5pt; font-weight:800; padding-bottom:0.02in; }
  .l-top u { display:inline-block; min-width:2in; border-bottom:1px solid #111; }
  .l-top .ctn b { font-size:14pt; }
  /* dense field list — left-aligned keys, aligned colons (matches existing label) */
  .maintop { display:flex; gap:0.15in; flex:1; min-height:0; padding-top:0.02in; }
  .maintop .left { flex:1; min-width:0; display:flex; flex-direction:column; }
  .ctn { font-size:11pt; font-weight:800; margin-bottom:0.05in; }
  .ctn b { font-size:14.5pt; }
  .fields { display:flex; flex-direction:column; }
  .f { display:flex; align-items:baseline; line-height:1.0; white-space:nowrap; font-size:31pt; font-weight:800; margin:0.012in 0; }
  .f.big > .v { font-size:1.36em; letter-spacing:0.03em; }   /* COLOR & SIZE — value enlarged + a little letter spacing */
  /* SIZE — M 이 H 로 보인다는 지적 (v9b).
     Arial Black 으로 바꿔봤더니 M 은 또렷해졌지만 강조가 죽었다 (넓은 글꼴이라
     같은 자리에서 덜 굵어 보인다). 그래서 글꼴은 Barlow Condensed 로 되돌리고
     대신 '크게' 해서 푼다 — 글자가 커지면 M 가운데 V 도 같이 깊어져 H 와 안 헷갈린다.
     SIZE 는 길어야 세 글자(2XL)라 키울 자리가 충분하다. */
  .f.size > .v { font-size:1.62em; letter-spacing:0.05em; }
  .f > .k { flex:none; width:1.02in; position:relative; font-weight:800; color:#1c2431; font-size:0.72em; }
  .f > .k::after { content:':'; position:absolute; right:0.1in; }
  .f > .v { flex:1; min-width:0; font-weight:900; color:#0f1720; overflow:hidden; text-overflow:ellipsis; }
  /* 눈이 갈 곳을 셋으로 좁힌다 — COLOR / SIZE / STYLE.
     박스를 고를 때 실제로 대조하는 건 이 셋이다.
     ITEM 은 STYLE 번호에서 나오는 정보라 사실상 중복이고, QTY 는 스타일·사이즈가
     정해지면 거의 항상 같은 값이다. 그래서 이 둘은 한 단계 눌러 배경으로 보낸다. (v9) */
  /* ⚠ 회색으로 눌렀더니 실제 열전사 출력에서 거의 안 보였다 (v9b).
     열전사 프린터는 흑/백 1비트라 회색을 점으로 흩어 찍어서 흐릿해진다.
     그래서 색은 전부 검정으로 되돌리고, 차이는 '크기와 굵기' 로만 준다.
     COLOR/SIZE/STYLE = 900,  ITEM/QTY = 700 + 살짝 작게. */
  .f.item > .v, .f.qty > .v { font-weight:800; color:#0f1720; letter-spacing:0; }
  .f.item > .k, .f.qty > .k { font-weight:800; color:#1c2431; }
  .f.item > .v { font-size:0.90em; }
  .f.qty  > .v { font-size:0.96em; }
  /* CUSTOMER — 있을 때만 나온다. 맨 윗줄에 작게: 누구 물건인지만 알면 되고,
     대조하는 건 여전히 COLOR / SIZE / STYLE 이라 자리를 뺏으면 안 된다. */
  .f.cust > .v { font-size:0.62em; font-weight:800; letter-spacing:0.02em; }
  .f.cust > .k { font-weight:800; color:#1c2431; font-size:0.52em; }
  .f.cust { margin:0 0 0.03in; }
  /* 오른쪽 칸은 고정폭이 아니라 '내용에 맞춘 폭' — 오른쪽 끝을 기준으로 정렬하고,
     LOT / CTN# 이 길어지면 왼쪽으로 자란다.  남는 폭은 전부 ITEM / COLOR 쪽으로 간다. */
  .right { width:auto; flex:0 0 auto; min-width:1.42in; max-width:2.0in;
           display:flex; flex-direction:column; align-items:flex-end; }
  .right .qb { position:absolute; right:0.22in; bottom:0.14in; width:1.5in; height:1.5in; }
  .right .qb svg { width:100%; height:100%; display:block; }
  .right .cap { font-size:7pt; font-weight:800; letter-spacing:.4px; margin:0.06in 0 1px; align-self:center; }
  /* 서명칸 — 조금 내리고 가로로 넓힌다 (v9). 라벨 이름(MOD/AUD/PRESS)이 먹던 폭을
     줄여서 그만큼 밑줄로 넘긴다. 줄 간격도 띄워 손으로 쓸 자리를 준다. */
  .right .so { width:100%; margin-top:0.30in; }
  /* MOD / AUD / PRESS 글자가 밑줄보다 살짝 떠 보이던 것 (v9b).
     flex-end 는 '상자 바닥' 을 맞추는데, 글자 상자는 줄간격(line-height) 때문에
     글자보다 아래로 더 내려와 있어서 밑줄만 처져 보였다.
     baseline 으로 맞추면 글자가 앉는 선과 밑줄이 같은 자리에 온다. */
  .right .so .r { display:flex; align-items:baseline; font-size:10pt; font-weight:800; line-height:1.62; }
  .right .so .r span { width:0.38in; color:#222; flex:none; }
  .right .so .r u { flex:1; border-bottom:2px solid #111; text-decoration:none; line-height:1; }
  .right .lotbox { width:100%; margin-top:0.11in; }
  .right .ctnr { font-size:11pt; font-weight:800; margin-top:0.02in; white-space:nowrap; display:flex; align-items:center; justify-content:flex-end; align-self:flex-end; }
  .right .ctnr b { font-size:15.5pt; margin-left:0.04in; font-weight:900; letter-spacing:0.06em; }
  .right .ctnr .bldg { display:inline-block; border:2px solid #111; border-radius:4px; padding:0 0.07in; margin-left:0.1in; font-size:13pt; font-weight:800; }
  .right .lotline { display:flex; align-items:baseline; font-size:13.5pt; font-weight:900; margin-top:0.04in; width:auto; align-self:flex-end; justify-content:flex-end; }
  .right .lotline .lv { flex:none; min-width:0; max-width:1.5in; overflow:hidden; text-overflow:clip; white-space:nowrap; letter-spacing:0.07em; }
  .right .lotline .lk { font-weight:700; color:#1c2431; }
  .right .lotline .lk::after { content:':'; margin-right:0.06in; }
  .right .boxes { display:flex; gap:0.06in; margin-top:0.05in; }
  .right .box { border:2.5px solid #111; border-radius:4px; min-width:0.44in; text-align:center; font-size:15pt; font-weight:800; padding:0.015in 0.05in; line-height:1.1; }
  /* STYLE — biggest, like existing */
  .f.qty { margin-top:0.055in; }
  .f.style2 { margin-top:0.06in; }
  /* padding-right 를 키우면 가운데 정렬된 숫자가 그만큼 왼쪽으로 간다 (QR 과 너무 붙지 않게) */
  .f.style2 > .v { font-size:84pt; letter-spacing:1px; text-align:center; padding-right:0.62in; }
  .rbadges { display:flex; gap:0.05in; margin-top:0; align-items:center; justify-content:flex-end; align-self:flex-end; }
  /* BLDG# 칸이 빠지면서(v9) 자리가 남았다 — SS / US 를 키운다.
     이 둘은 멀리서도 구분돼야 하는 표시라 라벨에서 제일 눈에 띄어야 한다. */
  .rbadges .badge, .rbadges .fbox { border:3px solid #111; border-radius:6px; width:0.62in; height:0.62in; flex:none; display:flex; align-items:center; justify-content:center; font-size:22pt; font-weight:900; letter-spacing:0.04em; text-indent:0.04em; line-height:1; }
  .rbadges .fbox { width:0.5in; height:0.5in; font-size:17pt; border-width:2px; }
  .rbadges .badge { font-size:24pt; font-weight:900; }
  /* T 한 글자는 SS 두 글자보다 폭이 절반이라 그냥 두면 비어 보인다 — 키워서 무게를 맞춘다 */
  .rbadges .badge.one { font-size:34pt; letter-spacing:0; text-indent:0; }
  /* US 가 꺼져 있어도 칸 크기는 그대로 둔다 — 라벨 생김새가 항상 같아야
     멀리서 봐도 어디를 볼지 바로 안다. 덤으로 US 켜고 끄고에 따라
     QR 크기가 흔들리지도 않는다. (v9) */
  .rbadges .badge.off { border-style:dashed; border-color:#c2c9d2; font-size:0; }
  .l-foot { display:flex; justify-content:space-between; align-items:center; padding-top:0.04in; gap:0.12in; }
  .l-foot .bc { flex:none; margin-left:0; display:flex; flex-direction:column; align-items:flex-start; }
  .l-foot .bc svg { display:block; }
  .l-foot .bcnum { font-size:7pt; font-weight:700; letter-spacing:0.06em; font-family:Consolas,'Courier New',monospace; margin-top:1px; white-space:nowrap; }
  .l-foot .mid { flex:1; text-align:center; line-height:1.1; transform:translateX(-0.02in); }
  .l-foot .mid .h { font-size:19pt; font-weight:900; letter-spacing:.5px; white-space:nowrap; }
  .l-foot .mid .m { white-space:nowrap; }
  .l-foot .mid .m { font-size:8.5pt; font-weight:700; color:#333; }
  .l-foot .mid .dt { font-size:17pt; font-weight:900; white-space:nowrap; line-height:1.05; }
  .l-foot .foot-r { flex:none; display:flex; flex-direction:column; align-items:center; gap:3px; transform:translateX(-0.18in); }
  .l-foot .foot-r { justify-content:center; }
  .l-foot .foot-r .d { font-size:17pt; font-weight:900; white-space:nowrap; }
  .l-foot .bldg { font-size:15pt; font-weight:800; border:2px solid #111; border-radius:5px; padding:0.01in 0.11in; }

  @media print {
    body { background:#fff; }
    .panel, .hint, .stage > .hint { display:none !important; }
    .wrap { display:block; padding:0; max-width:none; }
    .stage { width:100%; }
    #sheet { margin:0; }
    .label { border:none; margin:0; page-break-after:always; }
    @page { size:6in 4in; margin:0; }
  }
  /* ═══ 누르기만 하는 화면 (v9) — 타이핑 칸이 하나도 없다 ═══ */
  #pick{ --pk-line:#ccd4dd; --pk-sel:#0a5f52; --pk-selbg:#d7f0eb; }
  .pk-bar{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; min-height:30px; }
  .pk-chip{ font-size:15px; font-weight:800; padding:4px 11px; border-radius:8px;
    background:var(--pk-selbg); color:#08483e; border:1px solid transparent; cursor:pointer; }
  .pk-chip:hover{ border-color:var(--pk-sel); }
  .pk-step{ margin-left:auto; font-size:11px; color:#8895a3; font-weight:700; letter-spacing:.06em; }
  .pk-h{ font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    color:#7a8699; margin:0 0 10px; }
  /* 카테고리 제목은 목록을 훑을 때 눈이 걸리는 지점이다 — 크고 진하게 (v9) */
  .pk-cat{ font-size:15px; font-weight:900; letter-spacing:.02em; text-transform:uppercase;
    color:#12304a; margin:20px 0 8px; padding-bottom:6px; border-bottom:2px solid #12304a; }
  .pk-cat.kidcat{ color:#7a4310; border-bottom-color:#7a4310; }
  .pk-cat:first-of-type{ margin-top:2px; }
  .pk-cat.pk-often{ color:#0a5f52; border-bottom-color:#0a5f52; }
  .pk-fam{ font-size:12.5px; font-weight:900; color:#0a5f52; margin:9px 0 5px;
    display:flex; align-items:center; gap:7px; }
  .pk-fam::after{ content:''; flex:1; height:1px; background:#e0e7ec; }
  .pk-num{ width:100%; box-sizing:border-box; font:inherit; font-size:30px; font-weight:900;
    text-align:center; padding:8px 6px; border:2px solid var(--pk-line); border-radius:9px;
    color:#16202b; background:#fff; -moz-appearance:textfield; }
  .pk-num:focus{ outline:none; border-color:var(--pk-sel); }
  /* 비어 있으면 눈에 걸려야 한다 — 안 채우면 프린트가 안 된다 */
  .pk-num.empty{ border-color:#f0b429; background:#fffbf0; }
  .pk-num::placeholder{ color:#e2b566; font-weight:900; }
  .pk-num::-webkit-outer-spin-button, .pk-num::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .pk-grid{ display:grid; gap:7px; }
  .pk-g-style{ grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); }
  .pk-g-color{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .pk-g-size { grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); }
  .pk-b{ font:inherit; text-align:left; cursor:pointer; background:#fff; color:#16202b;
    border:2px solid var(--pk-line); border-radius:10px; padding:9px 11px; min-height:56px;
    display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .pk-b.adu{ background:#f2f7fb; border-color:#bcd3e6; }
  .pk-b.adu .n{ color:#12304a; }
  .pk-b.kid{ background:#fdf6ef; border-color:#e8cfae; }
  .pk-b.kid .n{ color:#7a4310; }
  .pk-b:hover{ border-color:var(--pk-sel); }
  .pk-b:active{ background:var(--pk-selbg); }
  .pk-b .n{ font-size:23px; font-weight:900; line-height:1; }
  .pk-b .s{ font-size:10.5px; color:#8895a3; font-weight:600; line-height:1.25; }
  /* ★ 자주 쓰는 스타일 (v12) — 카드 오른쪽 위 별 */
  .pk-b{ position:relative; }
  .pk-star{ position:absolute; top:2px; right:3px; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; font-size:17px; line-height:1;
    color:#cfd8e2; cursor:pointer; border-radius:7px; -webkit-tap-highlight-color:transparent; }
  .pk-star:hover{ background:rgba(0,0,0,.06); color:#b9861f; }
  .pk-star.on{ color:#e0a010; text-shadow:0 1px 0 rgba(0,0,0,.12); }
  .pk-b .n, .pk-b .s{ padding-right:24px; }   /* 별과 글자가 안 겹치게 */
  .pk-cat.pk-fav{ color:#a8760a; border-bottom-color:#e0a010; }
  /* ✎ Fix errors — 내용 카드 오른쪽 위 (v12) */
  .pk-box.pk-detail{ position:relative; }
  .pk-fixbtn{ position:absolute; top:9px; right:9px; margin:0 !important; }
  .pk-favgrid{ margin-bottom:22px; }   /* 아래 '1 · Tap the style' 와 붙지 않게 */
  .pk-favhint{ font-size:11px; color:#8895a3; font-weight:600; margin:-4px 0 8px; }
  .pk-b.sz{ align-items:center; text-align:center; min-height:66px; }
  .pk-b.sz .n{ font-size:27px; }
  .pk-b.cl{ flex-direction:row; align-items:center; gap:9px; min-height:50px; }
  .pk-b.cl .sw{ width:22px; height:22px; border-radius:5px; flex:none;
    border:1px solid rgba(0,0,0,.22); box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .pk-b.cl .cn{ font-size:15px; font-weight:800; line-height:1.15; }
  /* 원단 롤에 적힌 이름이 우리가 파는 이름과 다를 때만 뜬다 — 화면에만, 라벨에는 안 나간다 */
  .pk-b.cl .cfab{ display:block; font-size:10.5px; font-weight:800; color:#a06a12;
    letter-spacing:.02em; margin-top:3px; }
  .pk-b.cl.off .cfab{ color:#aeb6bf; }
  .pk-fab{ font-size:11.5px; font-weight:800; color:#a06a12; letter-spacing:.02em; }
  /* align-items:start — 6/12/24/48 을 뺀 뒤(v12) 왼쪽 칸이 오른쪽 높이만큼 늘어나
     숫자 밑에 빈 공간이 크게 남았다. 각 칸이 제 내용만큼만 높으면 된다. */
  .pk-row{ display:grid; grid-template-columns:1fr 1fr; gap:9px; align-items:start; }
  .pk-box{ border:1px solid var(--pk-line); border-radius:10px; padding:10px 12px; background:#fff; }
  .pk-box .t{ font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:#8895a3; margin-bottom:7px; }
  .pk-st{ display:flex; align-items:center; gap:7px; }
  .pk-st button{ width:42px; height:42px; border-radius:9px; border:2px solid var(--pk-line);
    background:#fff; font-size:22px; font-weight:900; cursor:pointer; line-height:1; color:#16202b; }
  .pk-st button:hover{ border-color:var(--pk-sel); }
  .pk-st .v{ flex:1; text-align:center; font-size:26px; font-weight:900; }
  .pk-pre{ display:flex; gap:5px; margin-top:7px; }
  .pk-pre button{ flex:1; padding:6px 0; border-radius:7px; border:1.5px solid var(--pk-line);
    background:#fff; font-size:13px; font-weight:800; cursor:pointer; color:#46525f; }
  .pk-pre button:hover{ border-color:var(--pk-sel); color:#16202b; }
  .pk-tg{ display:flex; gap:7px; }
  .pk-tg button{ flex:1; padding:11px 0; border-radius:9px; border:2px solid var(--pk-line);
    background:#fff; font-size:16px; font-weight:800; cursor:pointer; color:#46525f; }
  .pk-tg button.on{ border-color:var(--pk-sel); background:var(--pk-selbg); color:#08483e; }
  .pk-go{ width:100%; padding:17px 0; border:none; border-radius:11px; background:#0d7a37; color:#fff;
    font-size:23px; font-weight:900; letter-spacing:.02em; cursor:pointer; margin-top:12px; }
  .pk-go:hover{ filter:brightness(1.08); }
  .pk-back{ background:none; border:none; color:#8895a3; font-size:13px; font-weight:700;
    cursor:pointer; padding:8px 0; }
  .pk-back:hover{ color:#16202b; }
  .pk-split{ display:flex; align-items:center; gap:12px; margin:30px 0 6px;
    font-size:12px; font-weight:900; letter-spacing:.1em; color:#7a4310; }
  .pk-split::before, .pk-split::after{ content:''; flex:1; height:4px; background:#7a4310; border-radius:2px; }
  .pk-split span{ flex:none; white-space:nowrap; }
  .pk-old-btn{ border-style:solid; border-color:#dde3e9; color:#7a8699; font-size:14px; }
  .pk-old-btn:hover{ border-color:#0a5f52; color:#0a5f52; }
  /* PRIVATE ORDER — 우리 스타일이 아니라는 게 한눈에 보여야 한다 */
  .pk-split.priv{ color:#6b21a8; }
  .pk-split.priv::before, .pk-split.priv::after{ background:#6b21a8; }
  .pk-priv-btn{ border-style:solid; border-width:3px; border-color:#6b21a8; background:#faf5ff;
    color:#6b21a8; font-size:19px; font-weight:900; letter-spacing:.06em; padding:17px 0; }
  .pk-priv-btn:hover{ background:#f3e8ff; border-color:#581c87; color:#581c87; }
  .pk-b.priv{ background:#faf5ff; border-color:#d8b4fe; }
  .pk-b.priv .n{ color:#6b21a8; }
  .pk-b.priv .s{ color:#8b5cf6; }
  .pk-chip.priv{ background:#faf5ff; border-color:#d8b4fe; color:#6b21a8; }
  .pk-privbar{ margin:0 0 10px; padding:9px 12px; border-radius:9px; background:#faf5ff;
    border:2px solid #d8b4fe; color:#6b21a8; font-size:13px; font-weight:800; }
  /* 마지막에 손으로 고치는 칸 */
  .pk-ed{ display:flex; flex-direction:column; gap:7px; }
  .pk-ed-r{ display:flex; align-items:center; gap:9px; }
  .pk-ed-r > span{ flex:0 0 62px; font-size:12px; font-weight:900; letter-spacing:.05em; color:#46525f; }
  .pk-ed-r > input{ flex:1; min-width:0; font:800 16px/1.2 inherit; padding:9px 10px;
    border:2px solid #cfd8e3; border-radius:8px; background:#fff; color:#16202b; text-transform:uppercase; }
  .pk-ed-r > input:focus{ outline:none; border-color:#0a5f52; }
  /* 안 만드는 색 — 자리는 그대로, 눈에만 안 걸리게 */
  .pk-b.cl.off{ background:#f2f4f6; border-color:#e2e6ea; color:#98a3b0; }
  .pk-b.cl.off .cn{ color:#98a3b0; font-weight:800; }
  /* 'NOT MADE' 를 초록으로 두면 살아 있는 것처럼 읽힌다 — 회색으로 (v10) */
  .pk-b.cl.off .cq{ color:#a4aeb9; }
  .pk-b.cl.counting{ border-color:#c0392b; background:#fdecec; }
  .pk-b.cl.counting .cq{ color:#8e2118; font-size:10.5px; font-weight:900; margin-left:8px; }
  .pk-temp{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:#fdf0dc; border:2px solid #e6c893; border-radius:10px;
    padding:11px 13px; margin-bottom:12px; font-size:13px; font-weight:700;
    color:#8a5405; line-height:1.55; }
  .pk-temp > div:first-child{ flex:1; min-width:190px; }
  .pk-temp-b{ display:flex; gap:8px; flex:none; }
  .pk-temp-b button{ padding:9px 15px; border:2px solid #c99a3e; border-radius:8px;
    background:#fff; color:#8a5405; font:inherit; font-size:13px; font-weight:900; cursor:pointer; }
  .pk-temp-b button.keep{ background:#0a5f52; border-color:#0a5f52; color:#fff; }
  .pk-hint{ font-size:11.5px; color:#98a3b0; font-weight:700; margin:-4px 0 12px; line-height:1.5; }
  .pk-b.cl.off .cq:not(:empty){ font-weight:900; }
  .pk-b.cl.off:hover{ border-color:#b6bfc9; color:#6b7684; }
  .pk-b.cl{ position:relative; }
  /* Edit 를 켰을 때만 나오는 표시 — 평소 목록은 이름만 있어 깨끗하다 */
  .pk-b.cl.edit{ border-color:#c0392b; }
  .pk-b.cl.edit .cq{ color:#c0392b; font-size:16px; font-weight:900; margin-left:9px; }
  .pk-b.cl.edit.off{ border-color:#cbd3db; }
  .pk-b.cl.edit.off .cq{ color:#0a5f52; }
  .pk-b.cl.edit.counting{ background:#fdecec; border-color:#8e2118; }
  .pk-b.cl.edit.off.counting{ background:#e8f6f1; border-color:#0a5f52; }
  .pk-toprow{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .pk-toprow .pk-back-top{ margin:0; flex:1; text-align:left; }
  .pk-editbtn{ flex:none; padding:8px 14px; border:2px solid #dde3e9; border-radius:9px;
    background:#fff; font:inherit; font-size:13px; font-weight:900; color:#7a8699; cursor:pointer; }
  .pk-editbtn:hover{ border-color:#c0392b; color:#c0392b; }
  .pk-editbar{ display:flex; align-items:center; gap:12px; background:#fdf0dc;
    border:2px solid #e6c893; border-radius:10px; padding:10px 12px; margin-bottom:12px;
    font-size:13px; font-weight:700; color:#8a5405; line-height:1.5; }
  .pk-editbar button{ flex:none; padding:9px 20px; border:none; border-radius:8px;
    background:#0a5f52; color:#fff; font:inherit; font-size:14px; font-weight:900; cursor:pointer; }
  .pk-b.cl.off.counting{ border-color:#0a5f52 !important; background:#e8f6f1 !important; }
  .pk-b.cl.off.counting .cq{ color:#0a5f52 !important; }
  .pk-b.cl.off.counting .cq{ color:#0a5f52; }
  .pk-dim{ color:#98a3b0; font-weight:800; }
  .pk-back-top{ margin:0 0 12px; }
  .pk-q{ width:100%; margin:2px 0 14px; padding:15px 16px; border:3px solid #0a5f52;
    border-radius:12px; font:inherit; font-size:24px; font-weight:900; letter-spacing:.03em;
    text-transform:uppercase; color:#16202b; background:#fff; }
  .pk-q:focus{ outline:none; box-shadow:0 0 0 4px rgba(10,95,82,.16); }
  .pk-ok{ background:#e8f6f1; border:2px solid #0a5f52; color:#08453c; border-radius:10px;
    padding:11px 13px; font-size:15px; font-weight:800; margin-bottom:6px; }
  .pk-warn{ background:#fdecec; border:2px solid #c0392b; color:#8e2118; border-radius:10px;
    padding:12px 14px; font-size:14.5px; font-weight:700; line-height:1.55; margin-bottom:10px; }
  .pk-b .cq{ font-size:10px; font-weight:900; letter-spacing:.08em; color:#0a5f52;
    text-transform:uppercase; margin-left:8px; }
  .pk-danger{ border-color:#c0392b !important; color:#8e2118 !important; }
  .pk-danger:hover{ border-color:#8e2118 !important; color:#8e2118 !important; }
  .pk-wide{ width:100%; margin-top:11px; padding:13px 0; border-radius:10px;
    border:2px dashed #9aa7b4; background:#fff; color:#46525f; font:inherit;
    font-size:16px; font-weight:800; cursor:pointer; }
  .pk-wide:hover{ border-color:#0a5f52; color:#0a5f52; border-style:solid; }
  .pk-link{ background:none; border:none; padding:0; font:inherit; font-weight:900;
    color:#8a5405; text-decoration:underline; cursor:pointer; }
  .pk-note{ background:#fdf0dc; border:1px solid #d79a3a; border-radius:9px; padding:9px 11px;
    font-size:12px; color:#8a5405; font-weight:700; margin-top:12px; }
  @media print{ #pick, #legacy{ display:none !important; } }
</style>

<body>
<div class="wrap">
  <div class="panel">
    <h1>Haiti Box Label</h1>
    <p class="sub">Offline label maker &middot; 6&times;4 in &middot; QR</p>
    <p class="sub" style="font-size:11px;opacity:.7;margin-top:-6px;">데이터 v2026-08-28 &middot; <span id="hd-n"></span> &middot; PRIVATE ORDER 9990/9992/9994/9998 &middot; CUSTOMER 칸 &middot; 마지막 수정</p>


    <div id="pick"></div>

    <!-- 옛 입력칸들은 지우지 않고 감춰만 둔다.
         gen() 이 이 값들을 읽어서 라벨을 만들기 때문에, 화면(누르는 버튼)이
         여기에 값을 채워 넣는 구조다. 라벨 그리는 코드는 손대지 않았다. -->
    <div id="legacy" style="display:none;">
      <input id="f-style"><input id="f-item"><input id="f-color">
      <select id="f-size">
        <option>6M</option><option>12M</option><option>18M</option>
        <option>2T</option><option>3T</option><option>4T</option><option>5T</option>
        <option>XS</option><option>S</option><option>M</option><option selected>L</option>
        <option>XL</option><option>2XL</option><option>3XL</option><option>4XL</option>
        <option>5XL</option><option>6XL</option><option>OS</option>
      </select>
      <input id="f-qty"><input id="f-lot" value="01"><input id="f-fabric"><input id="f-sku"><input id="f-cust">
      <input id="f-date"><input id="f-bldg" value="27">
      <select id="f-constr"><option selected>Side Seam</option><option>Tubular</option></select>
      <input type="checkbox" id="f-us"><input id="f-n" value="12">
    </div>

    <button class="btn btn-print" onclick="window.print()">&#128424; Print</button>
    <button class="btn btn-sm" onclick="clearAll()">Clear</button>
    <button class="btn btn-sm" onclick="expCsv()" title="Export the list of labels printed on this computer">&#11015; Export log (CSV)</button>
    <button class="btn btn-sm" onclick="exportForHaiti()" title="Save a copy of this tool with the colours you locked already built in — send that file to Haiti">&#128190; Save file for Haiti</button>
  </div>

  <div class="stage">
    <p class="hint">Preview &mdash; each box below prints as one 6&times;4 in label. Fill the form and press <b>Generate</b>, then <b>Print</b>.</p>
    <div id="sheet"></div>
  </div>
</div>

  /**
   * qrcode
   * @param typeNumber 1 to 40

   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

      setupPositionAdjustPattern();
      setupTimingPattern();

      }

/*__PSFLOWX_DATA_STYLECOLORS__*/

var BIG = {'3XL':1,'4XL':1,'5XL':1,'6XL':1};
var CUR_COLORS = COLORS;   // colors currently offered in the COLOR dropdown (per entered style)
var LEARN_KEY='haiti_styles', LOG_KEY='haiti_log';

/* ═══ 라벨에 뭘 보여줄지 — 나중에 되살리려면 true 로만 바꾸면 된다 (v9) ═══
   날짜:   카톤번호 앞 6자리가 곧 만든 날이라 QR 이 더 정확하게 들고 있다.
   CTN#:   박스의 'Carton No.' 칸은 선적할 때 손으로 적는 별개 번호다.
           우리 고유번호는 QR 안에만 넣는다.
   LOT:    지금은 안 쓴다. 필요해지면 true — 입력 버튼과 라벨 줄이 같이 돌아온다.
   BLDG:   화면에서 뺀다. */
var SHOW_DATE = false;
var SHOW_CTN  = false;
var SHOW_LOT  = false;
var SHOW_BLDG = false;
var LBL_PER_BOX = 1;      // 박스당 라벨 장수. 아이티가 2장 붙인다고 하면 2 로.

/* ═══ 카톤번호 — 260827-K3M7XB2Q4L (날짜 6 + 랜덤 10) ═══
   왜 SSCC 를 버렸나: SSCC 는 확장숫자 하나에 10만 장이 한계라, 다 쓰면 누군가
   숫자를 바꿔줘야 했다. 아이티에서 그걸 제때 할 사람이 없다.
   랜덤은 컴퓨터끼리 아무 약속도 안 한다 — 각자 뽑아도 안 겹치고, 인터넷도 필요 없다.
   글자는 A-Z + 2-7 (RFC4648 base32). 0/O, 1/I 처럼 헷갈리는 짝이 아예 없다. */
var CTN_ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function ctnRand(len){
  var N=Math.max(1,len||10), out='';
  try{ var a=new Uint8Array(N); crypto.getRandomValues(a);
       for(var i=0;i<N;i++) out+=CTN_ABC.charAt(a[i]%32); }
  catch(e){ for(var j=0;j<N;j++) out+=CTN_ABC.charAt(Math.floor(Math.random()*32)); }
  return out;
}
function ctnDateStamp(d){ var t=d||new Date();
  return String(t.getFullYear()).slice(2)+pad(t.getMonth()+1,2)+pad(t.getDate(),2); }
function ctnNew(){ return ctnDateStamp()+'-'+ctnRand(10); }

var _bcId = 0;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n,l){ n=String(n); while(n.length<l) n='0'+n; return n; }
var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function todayStr(){ var d=new Date(); return pad(d.getDate(),2)+' '+MON[d.getMonth()]+' '+d.getFullYear(); }

// per-computer number 0-9 = SSCC extension digit (keeps cartons unique across offline computers)


// GS1 mod-10 check digit (rightmost data digit weight 3, alternating)


function getLearned(){ try{ return JSON.parse(localStorage.getItem(LEARN_KEY)||'{}')||{}; }catch(e){ return {}; } }
function saveLearned(o){ try{ localStorage.setItem(LEARN_KEY,JSON.stringify(o)); }catch(e){} }

function parseQtyPcs(v){ v=String(v); var m=v.match(/(\d+)\s*PCS/i); if(m) return parseInt(m[1],10); m=v.match(/(\d+)\s*DZS/i); if(m) return parseInt(m[1],10)*12; m=v.match(/\d+/); return m?parseInt(m[0],10):0; }

function styleInfo(s){
  s=String(s||'').trim();
  if(STYLES[s]) return {item:(STYLES[s].idesc||(STYLES[s].cat||'').toUpperCase()), ppb1:STYLES[s].ppb1, ppb2:STYLES[s].ppb2, fab:(STYLES[s].fab||'').toUpperCase(), known:true};
  var L=getLearned();
  if(L[s]) return {item:L[s].item||'', ppb1:L[s].ppb1||0, ppb2:L[s].ppb2||0, fab:L[s].fab||'', known:true, learned:true};
  return {known:false};
}
function qtyStr(ppb){ if(!ppb) return ''; var dz=ppb/12; return (dz===Math.round(dz)) ? (ppb+' PCS\u00A0\u00A0['+dz+' DZ]') : (ppb+' PCS'); }

// remember new colors a worker enters, per style, on this computer
var LEARN_COLOR_KEY='haiti_colors';
function getLearnedColors(){ try{ return JSON.parse(localStorage.getItem(LEARN_COLOR_KEY)||'{}')||{}; }catch(e){ return {}; } }
function saveLearnedColors(o){ try{ localStorage.setItem(LEARN_COLOR_KEY,JSON.stringify(o)); }catch(e){} }
function learnColor(style,color){
  style=String(style||'').trim(); color=String(color||'').trim().toUpperCase();
  if(!style||!color) return;
  /* PRIVATE 은 거래처마다 색 이름이 달라서 쌓아두면 목록만 지저분해진다 — 기억하지 않는다 */
  if(typeof PK_PRIV!=='undefined' && PK_PRIV[style]) return;
  var auth = (STYLECOLORS[style]&&STYLECOLORS[style].length)?STYLECOLORS[style]:null;
  if(auth && auth.some(function(c){return c.toUpperCase()===color;})) return;   // already an official color
  var L=getLearnedColors(); var arr=L[style]||[];
  if(arr.some(function(c){return c.toUpperCase()===color;})) return;            // already learned
  arr.push(color); L[style]=arr; saveLearnedColors(L);
}

// SAFETY: only offer the colors that actually belong to the entered style,
// so a worker can't pick a color from a different style by mistake.
// Official list (from the system) + any new colors this computer has learned.
// Unknown style -> fall back to the full list (and free-typing always works).
function colorsForStyle(s){
  s=String(s||'').trim();
  var base = (s && STYLECOLORS[s] && STYLECOLORS[s].length) ? STYLECOLORS[s].slice() : COLORS.slice();
  var learned = getLearnedColors()[s]||[];
  if(learned.length){
    var seen={}; base.forEach(function(c){ seen[c.toUpperCase()]=1; });
    learned.forEach(function(c){ if(!seen[c.toUpperCase()]){ base.push(c); seen[c.toUpperCase()]=1; } });
    base.sort();
  }
  return base;
}
function populateColors(s){
  CUR_COLORS = colorsForStyle(s);
  var dl=document.getElementById('colorlist');
  if(dl){ dl.innerHTML=''; for(var i=0;i<CUR_COLORS.length;i++){ var op=document.createElement('option'); op.value=CUR_COLORS[i]; dl.appendChild(op); } }
  var perStyle = !!(s && STYLECOLORS[String(s).trim()] && STYLECOLORS[String(s).trim()].length);
  var note=document.getElementById('color-note');
  if(note){
    if(perStyle) note.innerHTML='<span style="color:#16a34a;">'+CUR_COLORS.length+' colors for style '+esc(s)+'</span>';
    else if(s) note.innerHTML='<span style="color:#b45309;">style not on file &mdash; all colors shown, type to add</span>';
    else note.innerHTML='<span style="color:#16a34a;">select or type</span>';
  }
  checkColor();
}
// warn (don't block) if the typed colour isn't one of the style's known colours
function checkColor(){
  var inp=document.getElementById('f-color'); if(!inp) return;
  var v=(inp.value||'').trim().toUpperCase();
  var warn=document.getElementById('color-warn');
  var ok = !v || CUR_COLORS.some(function(c){ return c.toUpperCase()===v; });
  if(warn) warn.style.display = ok ? 'none' : 'block';
  inp.style.borderColor = ok ? '' : '#dc2626';
  inp.style.background = ok ? '' : '#fef2f2';
}

// enable only the sizes that belong to the entered style; grey out the rest (unknown style -> all enabled)
function applySizes(s){
  s=String(s||'').trim();
  var allow = (s && STYLESIZES[s] && STYLESIZES[s].length) ? STYLESIZES[s] : null;
  var sel=document.getElementById('f-size'); if(!sel) return;
  var opts=sel.options, cur=sel.value, curOk=false, firstOk='';
  for(var i=0;i<opts.length;i++){
    var v=opts[i].value;
    var ok = !allow || allow.indexOf(v)>=0;
    opts[i].disabled = !ok;
    opts[i].style.color = ok ? '' : '#c4cdd8';
    if(ok){ if(!firstOk) firstOk=v; if(v===cur) curOk=true; }
  }
  if(!curOk && allow){
    // current size not valid for this style -> pick a sensible default (L/M if available, else middle of allowed)
    var pref=['L','M','XL','S','4T','3T','2XL'], pick='';
    for(var k=0;k<pref.length;k++){ if(allow.indexOf(pref[k])>=0){ pick=pref[k]; break; } }
    if(!pick) pick = allow[Math.floor(allow.length/2)] || firstOk;
    if(pick) sel.value=pick;
  }
}
function onStyle(){
  var s=(document.getElementById('f-style').value||'').trim();
  var info=styleInfo(s);
  if(info.known){ document.getElementById('f-item').value=info.item||''; document.getElementById('f-fabric').value=info.fab||''; }
  populateColors(s);
  applySizes(s);
  onSize();
}
function onSize(){
  var s=(document.getElementById('f-style').value||'').trim();
  var info=styleInfo(s);
  if(!info.known) return;
  var size=document.getElementById('f-size').value;
  var ppb = BIG[size] ? (info.ppb2||info.ppb1) : (info.ppb1||info.ppb2);
  if(ppb) document.getElementById('f-qty').value = qtyStr(ppb);
}

var QR_ALNUM = /^[0-9A-Z $%*+\-.\/:]+$/;      // QR '영숫자 모드' 가 허용하는 글자 (5.5비트/글자)
function makeQrSvg(text){
  var qr=qrcode(0,'M');
  // 라이브러리는 그냥 넣으면 전부 바이트 모드(8비트/글자)로 담는다.
  // URL 을 대문자 경로로 만들어 놨으므로, 영숫자로 담을 수 있는 구간과 아닌 구간('box' 같은 소문자)을
  // 나눠서 넣으면 같은 내용이 37칸 -> 33칸으로 줄고 = 칸 하나가 굵어져 멀리서도 읽힌다.
  try{
    var parts = String(text).split(/([^0-9A-Z $%*+\-.\/:]+)/), put=0;
    for(var i=0;i<parts.length;i++){ if(!parts[i]) continue;
      qr.addData(parts[i], QR_ALNUM.test(parts[i]) ? 'Alphanumeric' : 'Byte'); put++; }
    if(!put) qr.addData(text);
  }catch(e){ qr = qrcode(0,'M'); qr.addData(text); }
  qr.make();
  return qr.createSvgTag({cellSize:6,margin:0,scalable:true});   // 흰 여백은 svg 안이 아니라 라벨 여백으로 확보 → 검은 부분이 박스 끝에 딱 맞음
}



/* ═══════════ 누르기만 하는 화면 (v9) ═══════════
   왜 바꿨나: 예전 폼은 STYLE·ITEM·COLOR·QTY·LOT·FABRIC·SKU·BLDG 를 손으로 쳤다.
   COLOR 는 "고를 수도, 칠 수도" 있었는데, 칠 수 있으면 결국 친다 —
   실제로 들어온 박스에 'US RANGER GREEN' 이라고 찍혀 나왔다.
   목록엔 'RANGER GREEN' 이고 US 는 따로 체크박스인데, 둘을 합쳐서 쳐버린 것이다.
   그 오타 하나가 미국 쪽 재고·웹사이트에서 색을 둘로 갈라놨다.
   그래서 칠 수 있는 칸을 아예 없앴다. 고르는 것만 가능하다.
   ITEM·FABRIC·QTY 는 스타일 번호에서 나오므로 물어볼 이유가 없다. */
/* 라벨 뽑는 화면에서만 감추는 스타일. 데이터(STYLES/STYLECOLORS)는 그대로 두므로
   이미 만든 라벨이나 같은 원단 색 목록에는 영향이 없다. 되살리려면 여기서 지우면 된다. */
var PK_HIDE = { '1388':1 };
/* ═══ 요즘 안 만드는 스타일 (v9) ═══
   지우는 게 아니라 맨 아래 접힌 칸으로 내린다 — 필요하면 한 번 눌러 꺼내 쓴다.
   위쪽에는 지금 실제로 돌리는 스타일만 남아서 찾기가 빨라진다.
   여기 씨앗으로 넣은 건 재고가 0 인 것들뿐이다. 나머지는 사람이 판단해야 해서
   (입고 날짜가 데이터 일괄 입력일로 몰려 있어 기계가 못 고른다) 여기에 번호만 추가하면 된다.
   되살리려면 그 줄만 지우면 끝. */
var PK_OLD = {
  /* Adult S/S — 2026-08-27 확정. keep: 1210 1290 1315 1350 1368 1390 1530 1580 1595 1600 1615 1690 8368 */
  '1180':1, '1230':1, '1240':1, '1260':1, '1280':1, '1315R':1, '1330':1, '1360':1, '1650':1, '6535':1, '9307':1,
  /* Adult L/S — keep: 1212 1292 1322 1362 1392 */
  '1232':1, '1262':1, '1332':1, '1352':1, '1532':1, '1652':1,
  /* Adult Tank Top — keep: 1214 1314 1364 */
  '1234':1, '1264':1, '1354':1, '1394':1, '1534':1,
  /* Adult V-Neck S/S — 전부 OTHER 로 */
  '1311':1, '1351':1
};
/* ═══ PRIVATE ORDER (v12) ═══

  if(pkIsPriv(PK.style)){ PK.cmode=''; PK.q=''; PK.priv='F'; PK.step=0; pkRender(); return; }
  PK.cmode=''; PK.q=''; pkRender();
}

/* 두 글자열이 얼마나 다른가 (편집 거리). max 를 넘으면 바로 포기 — 368개를 매 글자마다 재니까. */
function pkDist(a,b,max){
  a=String(a); b=String(b);
  if(Math.abs(a.length-b.length) > max) return max+1;
  var prev=[], cur=[], i, j;
  for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){
    cur[0]=i; var best=i;
    for(j=1;j<=b.length;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a.charAt(i-1)===b.charAt(j-1)?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best > max) return max+1;
    prev = cur.slice();
  }
  return prev[b.length];
}
/* 친 글자에 대한 후보들. 앞에서부터 맞는 것 → 안에 든 것 → 철자가 비슷한 것 순. */
function pkFind(q){
  var nq = pkNorm(q);
  if(!nq) return { exact:null, list:[] };
  var exact=null, starts=[], has=[], near=[], i, c, nc;
  var allow = nq.length<=4 ? 1 : (nq.length<=8 ? 2 : 3);
  for(i=0;i<COLORS.length;i++){
    c=COLORS[i]; nc=pkNorm(c);
    if(nc===nq){ exact=c; continue; }
    if(nc.indexOf(nq)===0) starts.push(c);
    else if(nc.indexOf(nq)>=0) has.push(c);
    else if(pkDist(nq,nc,allow)<=allow) near.push(c);
  }
  var list=[], seen={};
  [starts,has,near].forEach(function(g){ g.sort(); g.forEach(function(x){ if(!seen[x]){ seen[x]=1; list.push(x); } }); });
  return { exact:exact, list:list.slice(0,40) };
}
/* 입력할 때마다 결과칸만 새로 그린다 — pkRender() 를 부르면 글자 치던 칸이 사라진다. */
function pkQ(v){
  PK.q = String(v||'');
  var box=document.getElementById('pk-res'); if(box) box.innerHTML=pkResHtml();
}
function pkResHtml(){
  var raw = String(PK.q||'').toUpperCase().replace(/\s+/g,' ').trim();
  var us  = /^US\s+/.test(raw);
  var q   = us ? raw.replace(/^US\s+/,'').trim() : raw;
  var E=esc, h='';
  if(!q) return '<div class="pk-note">Start typing a colour name. We check it against our '+COLORS.length+' colours as you type.</div>';
  var r = pkFind(q);
  var cbtn=function(c,tag){ return '<button class="pk-b cl" onclick="pkPickTyped('+JSON.stringify(c).replace(/"/g,'&quot;')+')">'
    +'<span class="cn">'+E(c)+'</span>'+(tag?'<span class="cq">'+tag+'</span>':'')+'</button>'; };
  if(r.exact){
    h+='<div class="pk-ok">&#10004; <b>'+E(r.exact)+'</b> is one of our colours.</div>';
    h+='<div class="pk-grid pk-g-color">'+cbtn(r.exact,'use this')+'</div>';
  }
  if(r.list.length){
    h+='<div class="pk-cat">'+(r.exact?'Other close matches':'Did you mean')+' &mdash; '+r.list.length+'</div>'
      +'<div class="pk-grid pk-g-color">';
    for(var i=0;i<r.list.length;i++) h+=cbtn(r.list[i]);
    h+='</div>';
  }
  if(!r.exact && !r.list.length){
    h+='<div class="pk-warn">&#9888; <b>'+E(q)+'</b> is not one of our '+COLORS.length+' colours.<br>'
      +'Check the spelling first. If this really is a brand-new colour, use the button below and tell the office.</div>';
  }
  if(!r.exact){
    h+='<button class="pk-wide pk-danger" onclick="pkUseTyped()">Use &ldquo;'+E(q)+'&rdquo; anyway</button>';
  }
  if(us) h+='<div class="pk-note">&ldquo;US&rdquo; will be moved out of the name to the <b>US</b> mark on the label.</div>';
  return h;
}

function pkPickTyped(c){ pkApplyUs(); learnColor(PK.style, c); pkColor(c); }

  var raw = String(PK.q||'').toUpperCase().replace(/\s+/g,' ').trim();

  if(!confirm('"'+q+'" is not in our colour list.\n\nMake labels with this name?\n\nMake sure the spelling is right \u2014 it goes on the box and into our system.')) return;
  pkApplyUs(); learnColor(PK.style, q); pkColor(q);

/* 정규화: 괄호·공백·대소문자를 지운 비교용 형태.
   'EVER GREEN' 과 'EVERGREEN' 을 같은 것으로 본다. */
function pkNorm(v){ return String(v||'').toUpperCase().replace(/\([^)]*\)/g,'').replace(/[^A-Z0-9]/g,''); }
/* ═══ 안 만드는 색 (v10) ═══
   목록에서 아예 빼버리면 두 가지가 곤란하다 —
   나중에 그 색 주문이 들어왔을 때 되살릴 방법이 없고,
   빠진 건지 원래 없던 건지 사람이 구별을 못 한다.
   그래서 지우지 않고 '회색'으로 둔다. 눈에는 안 걸리지만 자리에는 있다.

   되살리기도 닫기도 세 번 눌러야 한다 — 한 번에 되면 스치기만 해도 바뀌어서
   어느 색이 살아 있는지 아무도 못 믿게 된다. 2.5초 안에 세 번이어야 하고,
   중간에 다른 걸 누르면 처음부터다.

   씨앗 목록은 아래에 적어둔 것뿐이고, 그 뒤로는 이 컴퓨터에 저장된 것이 우선이다.
   그래서 되살린 색이 파일을 새로 받아도 다시 회색이 되지 않는다. */
/* ═══ ★ 자주 쓰는 스타일 (v12) ═══
   목록이 67개라 매번 스크롤해서 찾는다. 실제로 도는 스타일은 몇 개뿐이니
   별을 눌러 위로 올려둔다. 아래 'Often used here' 는 이 컴퓨터가 센 것이고,
   이건 사람이 직접 고른 것이다 — 새 컴퓨터에서도 처음부터 채워져 있어야 해서 따로 둔다.

   FAV_SEED 는 사무실에서 정해 파일에 박아 보내는 기본값이다.
   'Save file for Haiti' 를 누르면 지금 별 표시가 여기에 그대로 들어간 새 파일이 나온다. */
var FAV_KEY='haiti_fav', FAV_SEED_KEY='haiti_fav_seed', FAV_SEED_V='v2';
/* 우리가 제일 많이 만드는 스타일 — 사무실에서 정한 고정 목록이고 순서도 정한 대로다.
   여기 적힌 순서 그대로 화면 맨 위에 나온다 (가나다순으로 다시 안 섞는다).
   바꾸려면 이 줄만 고치고 FAV_SEED_V 판 번호를 올리면 모든 컴퓨터가 따라온다. */
var FAV_SEED = ['8368','1368','1362','1348','1364','2388','1315','1322','1314','2316'];
function favAll(){
  try{
    var raw=localStorage.getItem(FAV_KEY);
    if(raw===null || localStorage.getItem(FAV_SEED_KEY)!==FAV_SEED_V){
      // 사무실에서 새 파일이 오면 그 파일의 기본 별을 넣어준다.
      // 아이티에서 추가로 눌러둔 별은 지우지 않는다 — 합친다.
      /* 사무실 목록이 먼저, 정한 순서 그대로. 아이티가 따로 눌러둔 별은 그 뒤에 붙인다.
         (사무실 목록에 이미 있는 건 두 번 넣지 않는다) */
      var mine = raw ? (JSON.parse(raw)||[]) : [];
      var out = FAV_SEED.slice();
      for(var i=0;i<mine.length;i++) if(out.indexOf(mine[i])<0) out.push(mine[i]);
      localStorage.setItem(FAV_KEY, JSON.stringify(out));
      localStorage.setItem(FAV_SEED_KEY, FAV_SEED_V);
      return out;
    }
    return JSON.parse(raw)||[];
  }catch(e){ return FAV_SEED.slice(); }
}
function favHas(k){ return favAll().indexOf(String(k))>=0; }
function favToggle(k){
  k=String(k);
  var a=favAll(), i=a.indexOf(k);
  if(i>=0) a.splice(i,1); else a.push(k);
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(a)); }catch(e){}
  return i<0;
}
/* 별을 눌렀을 때 — 카드 자체(스타일 고르기)는 안 눌리게 막는다 */
function pkFav(ev, k){
  try{ ev.stopPropagation(); ev.preventDefault(); }catch(e){}
  var on = favToggle(k);
  pkRender();
  if(typeof toast==='function'){ try{ toast(on ? ('\u2605 '+k+' added to FAVORITES') : ('\u2606 '+k+' removed')); }catch(e){} }

}

var INACT_KEY='haiti_inact', INACT_SEED_KEY='haiti_inact_seed', INACT_SEED_V='v2026-08-29a';
var INACT_SEED = {
  /* Juvy(3xxx) · Toddler(5xxx) 는 짝이 되는 Youth(2xxx) 와 같은 색을 끈다.
     2210 = 3210 = 5210, 2212 = 3212 = 5212, 2310 = 3310 = 5310, 2350 = 3350 = 5350.

  '5212': ['ATHLETIC HTR','GOLD'],
  '3310': ['AQUA BLUE','BURGUNDY','CARDINAL','DUNE','GRAPE','INDIGO BLUE','MUSTARD','PALM','PINK','POMEGRANATE','RED CLAY','SAND','SOFT PINK','STRAWBERRY'],
  '5310': ['AQUA BLUE','BURGUNDY','CARDINAL','DUNE','GRAPE','INDIGO BLUE','MUSTARD','PALM','PINK','POMEGRANATE','RED CLAY','SAND','SOFT PINK','STRAWBERRY'],
  '3350': ['SNOW BRICK','SNOW CLOVER'],
  '5350': ['SNOW BRICK','SNOW CLOVER']
};
function inactAll(){
  try{
    var raw=localStorage.getItem(INACT_KEY);
    if(raw===null || localStorage.getItem(INACT_SEED_KEY)!==INACT_SEED_V){
      var base=raw?(JSON.parse(raw)||{}):{};
      /* 사무실에서 새 파일이 오면(판 번호가 바뀌면) 그 파일에 적힌 스타일은
         사무실 것으로 덮어쓴다 — 안 그러면 파일을 보내도 아이티 화면이 안 바뀐다.
         파일에 안 적힌 스타일은 아이티가 손본 그대로 둔다. */
      var fresh = (raw===null);
      for(var k in INACT_SEED){
        if(fresh || !base[k]) base[k]=INACT_SEED[k].slice();
        else base[k]=INACT_SEED[k].slice();
      }
      localStorage.setItem(INACT_KEY, JSON.stringify(base));
      localStorage.setItem(INACT_SEED_KEY, INACT_SEED_V);
      return base;
    }

/* ═══ 잠근 건 남고, 푼 건 안 남는다 (v11) ═══
   푸는 걸 저장해버리면 "주문 하나 때문에 잠깐 풀었다가 다시 안 잠근" 색이
   영영 살아 있게 된다. 아무도 그걸 눈치채지 못한다.
   그래서 방향을 일부러 비대칭으로 만든다 —
     · 잠그기  → 저장된다 (다음에도, 파일을 새로 받아도 잠겨 있다)
     · 풀기   → 이번에만. 새로고침하면 도로 잠긴다.
   까먹는 쪽이 항상 '안전한 쪽'으로 굴러가게 하는 게 요점이다.
   진짜로 계속 살려둬야 하면 위에 뜨는 띠에서 'Keep on' 을 눌러야 한다 — 눌러야만 저장된다. */
var TEMP_ON = {};                       // 이번 판에만 살려둔 색. 저장 안 함.
function tempKey(st,c){ return String(st)+'|'+String(c).toUpperCase(); }
function tempList(){
  var out=[]; for(var k in TEMP_ON){ var i=k.indexOf('|'); if(k.slice(0,i)===String(PK.style)) out.push(TEMP_ON[k]); }
  return out.sort();
}
function inactLocked(st,c){             // 저장된 잠금 (임시해제 무시)
  var m=inactAll()[String(st)]||[];
  var u=String(c).toUpperCase();
  for(var i=0;i<m.length;i++) if(String(m[i]).toUpperCase()===u) return true;
  return false;
}
function inactHas(st,c){
  if(!inactLocked(st,c)) return false;
  return !TEMP_ON[tempKey(st,c)];       // 이번 판에 풀어놨으면 살아 있는 것으로 본다
}
function inactSet(st,c,on){
  try{
    var m=inactAll(), k=String(st), u=String(c).toUpperCase();
    var list=(m[k]||[]).filter(function(x){ return String(x).toUpperCase()!==u; });
    if(on) list.push(String(c));
    if(list.length) m[k]=list; else delete m[k];
    localStorage.setItem(INACT_KEY, JSON.stringify(m));
  }catch(e){}
}
/* 세 번 누르기 세는 곳 */
var TAP={ key:'', n:0, t:0 };
function tapCount(key){
  var now=Date.now();
  if(TAP.key!==key || (now-TAP.t)>2500){ TAP.key=key; TAP.n=0; }
  TAP.t=now; TAP.n++;
  return TAP.n;
}
function tapReset(){ TAP.key=''; TAP.n=0; TAP.t=0; }
/* 회색 색을 왼쪽 클릭했다 — 아무것도 바뀌지 않는다. 푸는 법만 알려준다. */
function pkRevive(c){

  pkRender();
}
/* Edit 를 켠 동안 — 세 번째에 켜지거나 꺼진다. 색은 절대 안 골라진다. */
function pkToggleColor(c){
  var off=inactHas(PK.style,c);
  var key=(off?'on|':'off|')+PK.style+'|'+c;
  if(tapCount(key)<3){ pkRender(); return; }
  tapReset(); PK.hint='';
  var tk=tempKey(PK.style,c);
  if(off){
    if(PK.edit){                        // 편집 중에 다시 켜면 — 아주 켜진다(저장)
      inactSet(PK.style,c,false);
      delete TEMP_ON[tk];
    } else {
      TEMP_ON[tk]=String(c);            // 풀기 — 이번에만
    }
  } else if(TEMP_ON[tk]){
    delete TEMP_ON[tk];                 // 임시로 풀어둔 걸 도로 잠근다
  } else {
    inactSet(PK.style,c,true);          // 잠그기 — 저장된다
  }
  pkRender();
}
/* 띠에서 누르는 것들 */
function tempLockAll(){
  for(var k in TEMP_ON) if(k.slice(0,k.indexOf('|'))===String(PK.style)) delete TEMP_ON[k];
  pkRender();
}
function tempKeepAll(){
  var names=tempList();

    +'\n\nThey stay on until someone turns them off again.')) return;
  for(var i=0;i<names.length;i++){

/* 색 위에서 오른쪽 클릭 3번 = 잠그기 / 풀기. 브라우저 메뉴는 막는다. */

// keep the main group (ITEM/COLOR/SIZE/QTY) all the SAME size; shrink them together only if a long value needs it
// shrink whole rows (label + value together) uniformly so a long value keeps full detail without looking mismatched
function fitGroup(rows){
  var i; for(i=0;i<rows.length;i++) rows[i].style.fontSize='';
  if(!rows.length) return;
  var base=[]; for(i=0;i<rows.length;i++) base[i]=parseFloat(getComputedStyle(rows[i]).fontSize);
  var scale=1, g=0;   // shrink all rows by the SAME factor so COLOR/SIZE keep their larger relative size
  while(g<220){
    var clip=false;
    for(i=0;i<rows.length;i++){ var v=rows[i].querySelector('.v'); if(v && v.scrollWidth>v.clientWidth+1){ clip=true; break; } }
    if(!clip || scale<=0.34) break;
    scale-=0.02; for(i=0;i<rows.length;i++) rows[i].style.fontSize=(base[i]*scale)+'px'; g++;
  }
}
function soloFit(v,floor){ if(!v) return; v.style.fontSize=''; var f=parseFloat(getComputedStyle(v).fontSize),h=0;
  while(v.scrollWidth>v.clientWidth+1 && f>(floor||10) && h<80){ f-=0.5; v.style.fontSize=f+'px'; h++; } }
// MADE IN HAITI + 날짜 뭉치를 STYLE 숫자(8368) 중앙에 맞춘다
function footAlign(root){
  var sv=root.querySelector('.f.style2 > .v'), mid=root.querySelector('.l-foot .mid');
  if(!sv||!mid) return;
  mid.style.transform='none';
  function tc(el){                      // 박스가 아니라 '글자'의 실제 중앙
    try{ var r=document.createRange(); r.selectNodeContents(el); var b=r.getBoundingClientRect();
         if(b.width) return b.left+b.width/2; }catch(e){}
    var q=el.getBoundingClientRect(); return q.left+q.width/2; }
  var mh=mid.querySelector('.h')||mid;
  var a={c:tc(sv)}, b={c:tc(mh)};
  var dx=a.c-b.c;
  mid.style.transform='translateX('+dx.toFixed(2)+'px)';
}
function fitVals(root){
  // fit each field on its OWN — a long ITEM shrinks by itself while COLOR/SIZE keep their larger size
  var fs=root.querySelectorAll('.f:not(.ss):not(.style2)');
  for(var i=0;i<fs.length;i++){ var row=fs[i], v=row.querySelector('.v'); soloFit(v,12);
    if(row.classList.contains('big')){ var f=parseFloat(getComputedStyle(v).fontSize); v.style.fontSize=(f-2)+'px'; } }  // 2px slack so letter-spacing never clips
  soloFit(root.querySelector('.f.ss > .v'),11);
  soloFit(root.querySelector('.f.style2 > .v'),22);
  soloFit(root.querySelector('.right .lotline .lv'),9);   // LOT shrinks to fit up to ~10 chars
}
// last resort: if the whole label overflows vertically, shrink the field list then STYLE until it fits
function fitVertical(root){
  // priority to KEEP big: STYLE > COLOR/SIZE > (ITEM = QTY).  ITEM and QTY shrink together as one tier.
  var foot=root.querySelector('.l-foot'), st=root.querySelector('.f.style2'), sv=st&&st.querySelector('.v');
  if(!foot||!st) return;
  function overlap(){ return st.getBoundingClientRect().bottom > foot.getBoundingClientRect().top-1; }
  function shrink(sel, floor){ var a=root.querySelectorAll(sel); for(var i=0;i<a.length;i++){ var z=parseFloat(getComputedStyle(a[i]).fontSize); if(z>floor){ a[i].style.fontSize=(z-1)+'px'; return true; } } return false; }
  // shrink the largest of a group so members converge to the same size
  function shrinkGroup(sel, floor){ var a=root.querySelectorAll(sel), mx=null, mv=-1;
    for(var i=0;i<a.length;i++){ var z=parseFloat(getComputedStyle(a[i]).fontSize); if(z>mv){ mv=z; mx=a[i]; } }
    if(mx && mv>floor){ mx.style.fontSize=(mv-1)+'px'; return true; } return false; }
  var g=0;
  while(overlap() && g<900){
    var did = shrinkGroup('.f:not(.big):not(.style2):not(.ss) > .v', 30)   // ITEM + QTY together (kept equal, not tiny)
           || shrink('.f.big > .v', 48)                                    // then COLOR/SIZE (still big)
           || (sv && (function(){ var z=parseFloat(getComputedStyle(sv).fontSize); if(z>66){ sv.style.fontSize=(z-2)+'px'; return true; } return false; })())  // STYLE last
           || shrink('.f > .v', 14);
    if(!did) break; g++;
  }
  qrFill(root);
}
// QR 은 흐름에서 빠져서 라벨 '오른쪽 아래 빈 구석'을 통째로 채운다.
// 왼쪽 한계 = STYLE 숫자와 MADE IN HAITI 뭉치의 오른쪽 끝 중 더 오른쪽 (스타일#은 항상 4자리)
// 위쪽 한계 = PRESS 줄 아래.  → 나머지 글자 배치는 전혀 건드리지 않는다.
function qrFill(root){
  var qb=root.querySelector('.qb'), so=root.querySelector('.right .so');
  if(!qb||!so) return;
  var cs=getComputedStyle(root), lb=root.getBoundingClientRect();
  var padL=parseFloat(cs.paddingLeft), padR=parseFloat(cs.paddingRight),
      padT=parseFloat(cs.paddingTop), padB=parseFloat(cs.paddingBottom);
  var boxR=lb.right-padR, boxB=lb.bottom-padB;
  function gR(sel){ var e=root.querySelector(sel); if(!e) return 0;
    try{ var r=document.createRange(); r.selectNodeContents(e); var b=r.getBoundingClientRect(); if(b.width) return b.right; }catch(x){}
    return e.getBoundingClientRect().right; }
  var GAP=26;                                       // quiet zone + 숨 쉴 여백 (0.27in) — 글자와 QR 이 붙어 보이지 않게
  var leftLimit = Math.max(gR('.f.style2 > .v'), gR('.l-foot .mid .h'), gR('.l-foot .mid .dt')) + GAP;
  var topLimit  = so.getBoundingClientRect().bottom + GAP;
  var wAvail = boxR - leftLimit, hAvail = boxB - topLimit;
  var side = Math.floor(Math.min(wAvail, hAvail));
  if(side > 70){ qb.style.width=side+'px'; qb.style.height=side+'px'; }
}
// 레이아웃이 다 잡힌 뒤 한 번 더 폭 검사. 오른쪽 칸이 '내용에 맞춘 폭' 이라
// 글자 크기를 정한 뒤에 칸 폭이 바뀌어 ITEM 이 "...L/S" 처럼 잘리는 일이 있었다.
// 여기서는 '줄이기만' 한다 (키우면 다시 넘칠 수 있으므로).
/* 글자가 칸을 넘으면 폰트를 줄인다.
   ⚠ 예전에는 scrollWidth > clientWidth 로 판단했는데, 이 요소들은
   text-overflow:ellipsis 라서 브라우저가 이미 잘라 그린 뒤라 scrollWidth 가
   clientWidth 와 똑같이 나온다 — 그래서 넘쳐도 영영 못 잡았다.
   (실제로 'ADULT 30/1 CVC S…' 와 'STYLE 83…' 이 그렇게 잘려 나갔다.)
   그래서 제약 없는 복제본을 만들어 '진짜 필요한 폭' 을 재서 비교한다. (v9) */
function natTextW(e){
  var cs=getComputedStyle(e);
  var m=document.createElement('span');
  m.style.cssText='position:absolute;left:-99999px;top:0;white-space:pre;visibility:hidden;';
  var keys=['fontFamily','fontSize','fontWeight','fontStyle','fontStretch','letterSpacing','wordSpacing','textTransform','fontVariant'];
  for(var i=0;i<keys.length;i++) m.style[keys[i]]=cs[keys[i]];
  m.textContent=e.textContent;
  document.body.appendChild(m);
  var w=m.getBoundingClientRect().width;
  m.parentNode.removeChild(m);
  return w;
}
function fitWidthGuard(root){
  var v = root.querySelectorAll('.f > .v, .right .lotline .lv');
  for(var i=0;i<v.length;i++){
    var e=v[i]; if(!e.clientWidth) continue;
    var cs=getComputedStyle(e);
    var avail = e.clientWidth - (parseFloat(cs.paddingRight)||0) - (parseFloat(cs.paddingLeft)||0) - 2;   // 2px 는 letter-spacing 꼬리 여유
    var f=parseFloat(cs.fontSize), g=0;
    while(natTextW(e) > avail && f>10 && g<400){ f-=0.5; e.style.fontSize=f+'px'; g++; }
  }
}
// 폰트가 늦게 로드되면 글자 폭이 달라지므로 fonts.ready 후 여기서 전체를 다시 맞춘다.

      '</div></div>'+
      '<div class="l-foot">'+
        '<div class="mid"><div class="h">MADE IN HAITI</div>'+(SHOW_DATE?'<div class="dt">'+esc(date)+'</div>':'')+'</div></div>';
    logRows.push([ctnStr, style, color, size, parseQtyPcs(qty), (isSS?'SIDE SEAM':'TUBULAR'), (usOn?'US':''), lot, date, cust]);
    sheet.appendChild(d);
    fitLabel(d);
    // 1D barcode removed (v8): GS1 규격 미달 + 프린트 뭉개짐 + 담긴 정보 없음
  }
  /* 1D 바코드(JsBarcode) 블록 제거 (v9) — bcJobs 는 v8 부터 항상 비어 있어
     실행되지 않는 죽은 코드였고, 지운 SSCC 함수를 참조하고 있었다. */
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitAll); }

  logSave(logRows);
  populateColors(style);
}

/* ═══ 뽑은 라벨 기록 — 이 컴퓨터에만 쌓인다. 서버로 아무것도 안 보낸다.
   나중에 데이터가 필요하면 'Export log (CSV)' 한 번 눌러 메일로 보내면 된다. (v9) ═══ */
function logSave(rows){
  if(!rows || !rows.length) return;
  try{
    var all = JSON.parse(localStorage.getItem(LOG_KEY)||'[]');
    var t = new Date().toISOString();
    for(var i=0;i<rows.length;i++) all.push([t].concat(rows[i]));
    if(all.length > 20000) all = all.slice(all.length-20000);   // 오래된 건 버린다
    localStorage.setItem(LOG_KEY, JSON.stringify(all));
  }catch(e){}
}
/* ═══ 아이티로 보낼 파일 만들기 (v11) ═══
   이 도구는 서버가 없다. 그래서 여기서 잠근 색은 '이 컴퓨터'에만 저장된다 —
   파일만 보내면 아이티 화면에는 아무것도 안 잠겨 있다.
   이 버튼은 지금 잠근 상태를 파일 안(INACT_SEED)에 박아 넣은 새 HTML 을 만들어 준다.
   그 파일을 보내면 아이티에서 열자마자 우리와 똑같이 잠겨 있다.

   임시로 풀어둔 색(TEMP_ON)은 일부러 안 담는다 —
   실수로 풀어둔 게 아이티까지 따라가면 안 된다. 저장된 잠금만 나간다.

   왜 통째로 다시 뽑나: 파일 하나만 오가게 하려고. 설정 파일이 따로 생기면
   둘 중 하나는 반드시 빠뜨린 채로 보내게 된다. */
function exportForHaiti(){
  var locks;
  try{ locks = inactAll(); }catch(e){ locks = {}; }
  var nSty=0, nCol=0;
  for(var k in locks){ nSty++; nCol += (locks[k]||[]).length; }

  /* 담기 전에 화면을 처음 상태로 되돌린다 — 만들어 둔 라벨이 파일에 딸려가지 않게 */
  try{ clearAll(); }catch(e){}
  try{ var hd=document.getElementById('hd-n'); if(hd) hd.textContent=''; }catch(e){}
  try{ var pk=document.getElementById('pick'); if(pk) pk.innerHTML=''; }catch(e){}

  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  /* INACT_SEED 통째 교체 + 판 번호 올리기.
     판 번호가 바뀌어야 이미 이 도구를 쓰던 컴퓨터도 새 잠금을 받아들인다. */
  var stamp = ctnDateStamp() + '-' + String(Date.now()).slice(-5);
  var seedTxt = 'var INACT_SEED = ' + JSON.stringify(locks, null, 2) + ';';
  var reSeed = /var INACT_SEED = \{[\s\S]*?\n\};/;
  if(!reSeed.test(html)){ alert('Could not build the file (INACT_SEED not found). Tell the office.'); return; }
  html = html.replace(reSeed, seedTxt);
  html = html.replace(/INACT_SEED_V\s*=\s*'[^']*'/, "INACT_SEED_V='" + stamp + "'");

  /* ★ 지금 별 표시(FAVORITES)도 같이 박아 보낸다 (v12) —
     안 그러면 파일만 보내고 아이티 화면에는 아무것도 안 올라와 있다. */
  try{
    var favTxt = 'var FAV_SEED = ' + JSON.stringify(favAll()) + ';';
    var reFav = /var FAV_SEED = \[[\s\S]*?\];/;
    if(reFav.test(html)){
      html = html.replace(reFav, favTxt);
      html = html.replace(/FAV_SEED_V\s*=\s*'[^']*'/, "FAV_SEED_V='" + stamp + "'");
    }
  }catch(e){}

  /* 만든 파일이 진짜 그 값을 담고 있는지 확인하고 내보낸다 */
  if(html.indexOf("INACT_SEED_V='" + stamp + "'") < 0){ alert('Could not build the file. Tell the office.'); return; }

  var name = 'haitiboxlabel-' + ctnDateStamp() + '.html';
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);

  try{ pkRender(); }catch(e){}
  alert('Saved  ' + name + '\n\n' + nCol + ' colour' + (nCol===1?'':'s') + ' locked across '
    + nSty + ' style' + (nSty===1?'':'s') + ' are built into this file.\n\n'
    + 'Send this file to Haiti. When they open it the same colours are already off.\n\n'
    + 'Colours turned on "just for now" are NOT included.');
}
function expCsv(){
  var all=[]; try{ all=JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }catch(e){}
  if(!all.length){ alert('No labels printed on this computer yet.'); return; }
  var head=['printed_at','carton_no','style','color','size','pcs','construction','us','lot','date','customer'];
  var q=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  /* customer 는 v12 에 생겼다 — 그 전 기록은 칸이 하나 모자라니 채워서 내보낸다 */
  var csv=[head.join(',')].concat(all.map(function(r){
    var row=r.slice(0,head.length); while(row.length<head.length) row.push('');
    return row.map(q).join(',');
  })).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='haiti-labels-'+ctnDateStamp()+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// init
(function(){
  document.getElementById('f-date').value = todayStr();
  pkRender();
})();
</script>
